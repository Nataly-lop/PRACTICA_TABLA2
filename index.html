<!DOCTYPE html> 
<html lang="es"> <!-- Idioma del documento --> 
<head> 
  <meta charset="UTF-8"> <!-- Codificación para caracteres especiales --> 
  <title>Tabla de Horarios</title> <!-- Título de la pestaña --> 
  <link rel="stylesheet" href="estilos.css"> <!-- Enlace al archivo CSS --> 
</head> 
<body> 
 
  <main> 
    <h1>Mi horario semanal</h1> <!-- Título principal --> 
 
    <!-- Tabla de horarios --> 
    <table> 
      <thead> 
        <tr> 
          <th>Día</th> <!-- Encabezado de columna --> 
          <th>Actividad</th> 
          <th>Hora</th> 
        </tr> 
      </thead> 
      <tbody> 
        <tr> 
          <td>Lunes</td> <!-- Celda de día --> 
          <td>Revisión de proyectos</td> <!-- Celda de actividad --> 
          <td>10:00 - 12:00</td> <!-- Celda de hora --> 
        </tr> 
        <tr> 
          <td>Martes</td> 
          <td>Diseño de materiales</td> 
          <td>14:00 - 16:00</td> 
        </tr> 
        <tr> 
          <td>Miércoles</td> 
          <td>Mentoría académica</td> 
          <td>09:00 - 11:00</td> 
        </tr> 
        <tr> 
          <td>Jueves</td> 
          <td>Soporte técnico</td> 
          <td>13:00 - 15:00</td> 
        </tr> 
        <tr> 
          <td>Viernes</td> 
          <td>Evaluación de procesos</td> 
          <td>11:00 - 13:00</td> 
        </tr> 
      </tbody> 
    </table> 
  </main> 
 
</body> 
</html>
